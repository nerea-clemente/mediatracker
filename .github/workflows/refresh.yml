name: Refresh BioMar coverage and deploy

on:
  schedule:
    # Times below are set for CEST (UTC+2, Danish summer time). They will
    # be 1 hour late during CET (UTC+1, late Oct–late Mar). To stay exact
    # year-round, edit when DST flips — or duplicate each line with the
    # CET equivalent if you want both seasons covered (at 2× run cost).
    #
    #   07:30 Danish → 05:30 UTC
    - cron: "30 5 * * *"
    #   11:30 Danish → 09:30 UTC
    - cron: "30 9 * * *"
    #   18:00 Danish → 16:00 UTC
    - cron: "0 16 * * *"
    #   00:00 Danish → 22:00 UTC (previous day)
    - cron: "0 22 * * *"
  push:
    branches:
      - main
      - claude/media-monitoring-tool-zDCcC
    paths-ignore:
      # Don't loop on the bot's own state commits
      - "state/**"
      - "dashboard/lib/seed.json"
  workflow_dispatch:
    inputs:
      analyzer_limit:
        description: "Max unprocessed mentions to analyze this run"
        required: false
        default: "60"

permissions:
  contents: write   # commit DB + seed.json back to the branch
  pages: write
  id-token: write

concurrency:
  group: refresh
  cancel-in-progress: false

env:
  MEDIATRACKER_DB: state/mediatracker.db
  ANALYZER_LIMIT: ${{ github.event.inputs.analyzer_limit || '60' }}
  # On push events, skip the slow ingest/analyze pipeline — we just want
  # to rebuild the dashboard against whatever seed.json is already
  # committed. Schedule + manual dispatch run the full thing.
  RUN_PIPELINE: ${{ github.event_name != 'push' }}

jobs:
  refresh-and-build:
    runs-on: ubuntu-latest
    steps:
      # ----- repo + state checkout -----
      - uses: actions/checkout@v4
        with:
          # Bot needs write access to push state commits
          token: ${{ secrets.GITHUB_TOKEN }}
          # Need full history so the push of state changes is non-fast-forward-safe
          fetch-depth: 0

      # ----- Python pipeline (skipped on push for fast dashboard-only iterations) -----
      - if: env.RUN_PIPELINE == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python deps
        if: env.RUN_PIPELINE == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Ingest RSS feeds
        if: env.RUN_PIPELINE == 'true'
        run: python -m mediatracker.ingest

      - name: Analyze unprocessed mentions
        if: env.RUN_PIPELINE == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python -m mediatracker.analysis.analyzer --limit "$ANALYZER_LIMIT"

      - name: Cluster into stories
        if: env.RUN_PIPELINE == 'true'
        run: python -m mediatracker.cluster

      - name: Export dashboard snapshot
        if: env.RUN_PIPELINE == 'true'
        run: python -m mediatracker.export

      - name: Show summary stats
        if: env.RUN_PIPELINE == 'true'
        run: |
          echo "::group::DB stats"
          sqlite3 "$MEDIATRACKER_DB" 'SELECT
              (SELECT COUNT(*) FROM mentions)         AS mentions,
              (SELECT COUNT(*) FROM mentions WHERE processed=1) AS analyzed,
              (SELECT COUNT(DISTINCT cluster_id) FROM mentions) AS stories,
              (SELECT printf("%.4f", COALESCE(SUM(cost_usd), 0)) FROM api_calls) AS total_cost_usd
            ;'
          echo "::endgroup::"

      # ----- commit state back -----
      - name: Commit state and snapshot
        if: env.RUN_PIPELINE == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name  "mediatracker-bot"
          git config user.email "mediatracker-bot@users.noreply.github.com"
          git add state/mediatracker.db dashboard/lib/seed.json
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "refresh: BioMar coverage snapshot $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin "HEAD:${GITHUB_REF#refs/heads/}"
          fi

      # ----- build dashboard -----
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: dashboard/package-lock.json

      - run: npm ci
        working-directory: dashboard

      - name: Build static site
        run: npm run build
        working-directory: dashboard
        env:
          DEPLOY_BASE_PATH: /mediatracker

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard/out

  deploy:
    needs: refresh-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
